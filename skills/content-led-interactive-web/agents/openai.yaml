interface:
  display_name: "內容主導互動網站"
  short_description: "從讀者任務、設計論點與品牌記憶出發，設計非模板化的高互動網站。"
  default_prompt: "使用 $content-led-interactive-web，按這個任務的讀者、主題、目的、明示風格與品牌限制重新推導方向；如要做前衛高動態體驗，先用官方資料進行技術試鏡並比較三組視覺引擎組合，而不是套用安全模板或示例外觀。若頁面有多個視覺階段，先建立 Visual Range Contract：保留共同錨點、把風格轉換綁定內容狀態，並把變化收在一至三個模式內，除非內容能明確證明需要破格。所有公開可見文案亦要通過具體性、替換／刪除和對舉證據檢查，避免靠空泛套語營造深刻感。影像策略必須建立逐章 Section Asset Coverage Map：每個主要章節判定 raster needed、code-native stronger 或承接既有圖像世界；一張 hero 圖不是預設上限，也不可因湊圖片數而把可互動的圖譜 raster 化。交付前必須用真實瀏覽器按 Visual Acceptance Matrix 檢查窄、一般及必要的寬視圖；可讀文字、CTA、節點與控制項不可被裝飾或另一語義元素遮擋。圖譜在窄螢幕容不下時必須重編排，不可只縮放、裁切或用負 margin。若發現問題，最多作兩輪針對性修正及重驗，仍未通過便標示未 ready／未驗證與讀者影響，不可包裝成已驗收。"
